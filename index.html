<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học vụ &amp; Điều phối Phòng học — EIU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#F6F5F1; --surface:#FFFFFF; --line:#DDD9CE;
    --ink:#16213E; --ink-soft:#5A6478;
    --accent:#B8863F; --accent-ink:#7A5A28;
    --navy:#2C4A7C; --teal:#1F7A6C; --brass:#B8863F;
    --terracotta:#B25B45; --slate:#6B7280; --plum:#6B4E71;
    --danger:#C0392B; --danger-bg:#FBEAE7; --good:#2E8B57;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Source Serif 4',Georgia,serif;}
  header{
    padding:28px 40px 0; max-width:1180px; margin:0 auto;
  }
  .brand{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand h1{font-size:1.5rem; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .brand p{margin:4px 0 0; color:var(--ink-soft); font-size:0.92rem;}
  nav{display:flex; gap:28px; margin-top:22px; border-bottom:1px solid var(--line);}
  nav button{
    background:none; border:none; padding:10px 2px 12px; font:inherit; font-size:0.95rem;
    color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  nav button.active{color:var(--ink); font-weight:600; border-color:var(--accent);}
  nav button.soon{color:#B7B2A6; cursor:default;}
  nav button.soon::after{content:" · sắp có"; font-size:0.78rem;}

  main{max-width:1180px; margin:0 auto; padding:28px 40px 60px;}

  #status{
    font-size:0.85rem; color:var(--ink-soft); display:flex; align-items:center; gap:10px;
    margin-bottom:20px;
  }
  #status button{
    font:inherit; font-size:0.82rem; color:var(--accent-ink); background:none;
    border:1px solid var(--line); border-radius:5px; padding:4px 10px; cursor:pointer;
  }
  #status button:hover{border-color:var(--accent);}
  #error-banner{
    display:none; background:var(--danger-bg); color:var(--danger); border:1px solid #E7C3BC;
    border-radius:6px; padding:14px 16px; margin-bottom:20px; font-size:0.9rem; line-height:1.5;
  }
  #error-banner strong{display:block; margin-bottom:4px;}
  #error-banner code{background:rgba(0,0,0,.06); padding:1px 5px; border-radius:3px;}

  .hero{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:28px 32px; display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:20px; margin-bottom:20px;
  }
  .hero .label{font-size:0.95rem; color:var(--ink-soft); margin:0 0 6px;}
  .hero .value{font-size:3.4rem; line-height:1; color:var(--accent-ink); margin:0;}
  .hero .sub{font-size:0.92rem; color:var(--ink-soft); margin:10px 0 0;}
  .alert-chip{
    background:var(--danger-bg); color:var(--danger); border:1px solid #E7C3BC;
    border-radius:20px; padding:8px 16px; font-size:0.85rem; font-weight:500; white-space:nowrap;
  }
  .alert-chip.ok{background:#E8F3EC; color:var(--good); border-color:#C7E2D0;}

  .kpi-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px;}
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--navy);
    border-radius:6px; padding:16px 18px;
  }
  .kpi:nth-child(2){border-top-color:var(--teal);}
  .kpi:nth-child(3){border-top-color:var(--brass);}
  .kpi .n{font-size:1.7rem; font-weight:600;}
  .kpi .l{font-size:0.85rem; color:var(--ink-soft); margin-top:2px;}

  .chart-row{display:grid; grid-template-columns:1fr 1.3fr; gap:18px;}
  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:22px;
  }
  .panel h2{font-size:1.05rem; font-weight:600; margin:0 0 18px;}
  .panel .canvas-wrap{position:relative; height:320px;}

  #tab-soon{display:none; text-align:center; padding:80px 20px; color:var(--ink-soft);}

  @media (max-width:820px){
    header, main{padding-left:20px; padding-right:20px;}
    .kpi-row{grid-template-columns:1fr 1fr;}
    .chart-row{grid-template-columns:1fr;}
    .hero .value{font-size:2.6rem;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <h1 class="serif">Học vụ &amp; Điều phối Phòng học</h1>
      <p>Kết nối trực tiếp PostgreSQL (Supabase) · Học kỳ 251</p>
    </div>
  </div>
  <nav>
    <button class="active" data-tab="overview">Tổng quan</button>
    <button class="soon">Đánh giá giảng viên</button>
    <button class="soon">Phòng &amp; tòa nhà</button>
    <button class="soon">Theo tuần</button>
    <button class="soon">Xung đột lịch</button>
  </nav>
</header>

<main>
  <div id="status">
    <span id="status-text">Đang tải dữ liệu…</span>
    <button id="reload-btn" onclick="loadOverview()">Tải lại dữ liệu</button>
  </div>

  <div id="error-banner"></div>

  <section id="tab-overview">
    <div class="hero">
      <div>
        <p class="label">Tổng giờ dạy toàn học kỳ</p>
        <p class="value serif" id="kpi-hours">—</p>
        <p class="sub" id="hero-sub">—</p>
      </div>
      <div class="alert-chip" id="unscheduled-chip">—</div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="n" id="kpi-gv">—</div><div class="l">Giảng viên có lịch dạy</div></div>
      <div class="kpi"><div class="n" id="kpi-mon">—</div><div class="l">Môn học</div></div>
      <div class="kpi"><div class="n" id="kpi-phong">—</div><div class="l">Phòng học</div></div>
    </div>

    <div class="chart-row">
      <div class="panel">
        <h2>Tỷ trọng giờ dạy theo tòa nhà</h2>
        <div class="canvas-wrap"><canvas id="chart-building"></canvas></div>
      </div>
      <div class="panel">
        <h2>Top 8 giảng viên theo số giờ dạy</h2>
        <div class="canvas-wrap"><canvas id="chart-top-gv"></canvas></div>
      </div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   CẤU HÌNH — dán 2 giá trị lấy từ Supabase > Project Settings > API
   ============================================================ */
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
/* ============================================================ */

const BUILDING_COLORS = ["#2C4A7C","#1F7A6C","#B8863F","#B25B45","#6B7280","#6B4E71"];
let chartBuilding, chartTopGv;

async function fetchView(viewName, query = "") {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${viewName}?${query}`, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${viewName}: HTTP ${res.status} — ${body.slice(0, 200)}`);
  }
  return res.json();
}

function vn(n) {
  return Number(n).toLocaleString("vi-VN");
}

function showError(err) {
  const box = document.getElementById("error-banner");
  box.style.display = "block";
  box.innerHTML = `
    <strong>Không tải được dữ liệu</strong>
    Kiểm tra lại <code>SUPABASE_URL</code> và <code>SUPABASE_ANON_KEY</code> ở đầu file,
    và đảm bảo đã chạy xong khối SQL tạo view + GRANT SELECT trong Supabase.<br>
    Chi tiết lỗi: <code>${err.message}</code>
  `;
  document.getElementById("status-text").textContent = "Tải dữ liệu thất bại.";
}

function clearError() {
  document.getElementById("error-banner").style.display = "none";
}

async function loadOverview() {
  clearError();
  if (typeof Chart === 'undefined') {
    showError(new Error('Chart.js chưa load. Thử tải lại trang (F5).'));
    return;
  }
  document.getElementById("status-text").textContent = "Đang tải dữ liệu…";
  try {
    const [kpi] = await fetchView("v_overview_kpi");
    const buildings = await fetchView("v_hours_by_building");
    const topGv = await fetchView("v_top_instructors", "limit=8");

    // ---- KPI + hero ----
    document.getElementById("kpi-hours").textContent = vn(kpi.tong_gio);
    document.getElementById("kpi-gv").textContent = vn(kpi.so_gv);
    document.getElementById("kpi-mon").textContent = vn(kpi.so_mon);
    document.getElementById("kpi-phong").textContent = vn(kpi.so_phong);
    document.getElementById("hero-sub").textContent =
      `trên ${vn(kpi.so_gv)} giảng viên · ${vn(kpi.so_mon)} môn học · ${vn(kpi.so_phong)} phòng`;

    const chip = document.getElementById("unscheduled-chip");
    if (kpi.nhom_chua_xep_lich > 0) {
      chip.textContent = `${vn(kpi.nhom_chua_xep_lich)} nhóm lớp chưa xếp lịch`;
      chip.classList.remove("ok");
    } else {
      chip.textContent = "Không có nhóm lớp chưa xếp lịch";
      chip.classList.add("ok");
    }

    // ---- Donut: giờ theo tòa nhà ----
    const bLabels = buildings.map(b => b.building);
    const bValues = buildings.map(b => b.total_hours);
    if (chartBuilding) chartBuilding.destroy();
    chartBuilding = new Chart(document.getElementById("chart-building"), {
      type: "doughnut",
      data: { labels: bLabels, datasets: [{ data: bValues, backgroundColor: BUILDING_COLORS, borderWidth:0 }] },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { font: { family: "Inter" }, boxWidth: 12 } } }
      }
    });

    // ---- Bar ngang: top GV ----
    const gLabels = topGv.map(g => g.instructor_name);
    const gValues = topGv.map(g => g.total_hours);
    if (chartTopGv) chartTopGv.destroy();
    chartTopGv = new Chart(document.getElementById("chart-top-gv"), {
      type: "bar",
      data: { labels: gLabels, datasets: [{ data: gValues, backgroundColor: "#2C4A7C", borderRadius: 3 }] },
      options: {
        indexAxis: "y",
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { title: { display: true, text: "Giờ dạy" } } }
      }
    });

    document.getElementById("status-text").textContent =
      `Đã tải dữ liệu lúc ${new Date().toLocaleTimeString("vi-VN")}`;
  } catch (err) {
    console.error(err);
    showError(err);
  }
}

loadOverview();
</script>
</body>
</html>
